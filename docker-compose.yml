services:
  api:
    build: .
    container_name: url-shortener-api
    env_file:
      - .env
    environment:
      DB_ADDR: postgres://admin:admin@db:5432/urlshortener?sslmode=disable
      SERVER_ADDRESS: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  db:
    image: postgres:17
    container_name: url-shortener-db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-urlshortener}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      PGPORT: ${POSTGRES_PORT:-5432}
    networks:
      - backend
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5430:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-urlshortener}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db-data:

networks:
  backend:
    driver: bridge
